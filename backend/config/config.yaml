defaults:
  - model: random_forest

data:
  file_path: "C:\\Users\\fraca\\forecast_refactored\\TEST DATI SAMPLE.xlsx"
  separator: ";"
  date_column: "Settimana"
  target_column: "Sellout"
  product_column: "Item"
  nr_horizon: 1           # <-- POSITIVO: 1 settimana avanti
  product_name: "CHARLIE"
  granularity: "weekly"

# Opzioni extra per SalesDataset (nuove)
dataset_config:
  known_future_promos: false          # true SOLO se conosci le promo future
  market_lags: [1, 4, 8, 12]
  market_trend_windows: [4, 8]
  # opzionale: scaling per-serie (serie a scale diverse)
  per_series_scaling:
    enabled: true
    method: zscore       # o "robust" (median/MAD) se hai molti outlier da promo
    windows: [8, 26]

prepare:
  lag:
    weekly:
      ${data.target_column}: [1, 3, 4, 5]   # <-- tolto -1 (era futuro)
      Prezzo: [1, 3, 4, 5]                  # dare sempre anche lag 1 al prezzo
    monthly:
      ${data.target_column}: [1, 2, 3]      # (se userai monthly)
      Prezzo: [1, 2, 3]

  percentage:
    weekly:
      ${data.target_column}: [2, 3, 4]
      Prezzo: [4, 8, 12]
    monthly:
      ${data.target_column}: [1, 2, 3]
      Prezzo: [1, 2, 3]

  rolling:
    max:
      weekly:
        ${data.target_column}: [2, 3, 5, 10]
        Prezzo: [3]
      monthly:
        ${data.target_column}: [1]
        Prezzo: [1]
    min:
      weekly:
        ${data.target_column}: [2, 3, 5, 10]
        Prezzo: [3]
      monthly:
        ${data.target_column}: [1]
        Prezzo: [1]
    std:
      weekly:
        ${data.target_column}: [3, 5]
        Prezzo: [3, 5]
      monthly:
        ${data.target_column}: [1]
        Prezzo: [1]
    median:
      weekly:
        ${data.target_column}: [5, 10]
        Prezzo: [10]
      monthly:
        ${data.target_column}: [1, 2, 3]
        Prezzo: [1, 2, 3]

  # trend (puoi riattivare se vuoi slope locale della serie)
  # trend:
  #   weekly:
  #     ${data.target_column}: [5]
  #     Prezzo: [5]

column_selection:
  # Meno dipendenza da 'prefixes'; concentriamoci su suffix+regex
  prefixes: []
  suffixes:
    - "W"           # lag/rolling che terminano con W
    - "sin"         # stagionalità
    - "cos"
    - "trend"
    - "percentage"
    - "season"
    - "Settimana"
    - "Item"        # per includere il product id/categoria se rimane come stringa
  regex:
    # Market features ammesse
    - "^market_sum_ex_lag\\d+$"
    - "^market_mean_ex_lag\\d+$"
    - "^market_trend_ex_w\\d+$"
    # Rolling generiche (se hai naming tipo *_rolling_op_\\d+[WM])
    - "_rolling_.*_\\d+[WM]$"
    # Week/calandario
    - "week_number$"
    - "is_peak_season$"
    # Tempo codificato (se i nomi sono diversi)
    - f"{data.date_column}_sin$"
    - f"{data.date_column}_cos$"
    # Lags semplici del target/prezzo (nomi tipo Sellout_1W, Prezzo_4W, ecc.)
    - f"^{data.target_column}_\\d+[WM]$"
    - "^Prezzo_\\d+[WM]$"
    - "^product_age_w$"
    - "^${data.target_column}_ema_h\\d+$"     # cattura Sellout_ema_h4, h8, h13, ...
    - "^price_(gap|rel)_1W$"                  # se usi price_gap_1W / price_rel_1W

  to_exclude:
    #- "${data.date_column}"          # <— escludi la data grezza
    - "^market_sum_ex$"
    - "^market_mean_ex$"
    # Se NON conosci promo future, escludi eventuali colonne tipo _{h}W:
    - "^type_promo_\\d+_\\d+[WM]$"
  callables: []

train:
  train_len: "12m"     # maiuscolo/minuscolo ok, ma standardizza (M mesi, W settimane)
  test_len:  "8w"      # <-- allineato alla CV; prima era 9w
  boundary: "2025-01-20"

cv:
  n_folds: 3
  val_len: "8w"        # uguale a test_len
  scoring: "neg_mean_absolute_error"
  recency_gamma: 0.08

stock:
  safety_stock_window: 4
  lead_time: 1
  service_level: 0.95


mlflow:
  tracking_uri: "file:./mlruns"     # o il tuo server
  experiment_name: "forecast-backtest"

backtest:
  enabled: true
  n_cuts: 3
  output_dir: "outputs/backtest"
