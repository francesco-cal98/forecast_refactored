defaults:
  - model: light_gbm
  # Switch data source here — no other changes needed:
  #   xlsx_sample  → TEST DATI SAMPLE.xlsx  (products: ALPHA, BETA, DELTA, CHARLIE)
  #   csv_history  → History_SellIn_SellOut.csv
  - data: xlsx_sample

# Opzioni extra per SalesDataset (nuove)
dataset_config:
  known_future_promos: false          # true SOLO se conosci le promo future
  market_lags: [1, 4, 8, 12]
  market_trend_windows: [4, 8]
  # opzionale: scaling per-serie (serie a scale diverse)
  per_series_scaling:
    enabled: true
    method: zscore       # o "robust" (median/MAD) se hai molti outlier da promo
    windows: [8, 26]

prepare:
  lag:
    weekly:
      # Short-horizon momentum lags (1-5 weeks)
      # + lag-26: 6-month seasonal anchor (half-year cycle, robust for series < 52 weeks)
      # + lag-52: same-week-last-year anchor (strongest seasonal signal for mature products)
      # Note: lag-52 requires at least 52 weeks of history; dataset.py fills NaN with 0
      # for new products so it is safe to include unconditionally.
      ${data.target_column}: [1, 2, 3, 4, 5, 26, 52]
      #Prezzo: [1, 3, 4, 5]
    monthly:
      ${data.target_column}: [1, 2, 3, 6, 12]
      #Prezzo: [1, 2, 3]

  percentage:
    weekly:
      # [2,3,4]: short-term momentum
      # 52: year-over-year growth rate — strongest seasonal context signal
      ${data.target_column}: [1, 2, 3, 4, 52]
      #Prezzo: [4, 8, 12]
    monthly:
      ${data.target_column}: [1, 2, 3, 12]
      #Prezzo: [1, 2, 3]

  rolling:
    max:
      weekly:
        ${data.target_column}: [2, 3, 5, 10]
        #Prezzo: [3]
      monthly:
        ${data.target_column}: [1]
        #Prezzo: [1]
    min:
      weekly:
        ${data.target_column}: [2, 3, 5, 10]
        #Prezzo: [3]
      monthly:
        ${data.target_column}: [1]
        #Prezzo: [1]
    std:
      weekly:
        ${data.target_column}: [3, 5]
        #Prezzo: [3, 5]
      monthly:
        ${data.target_column}: [1]
        #Prezzo: [1]
    median:
      weekly:
        ${data.target_column}: [5, 10]
        #Prezzo: [10]
      monthly:
        ${data.target_column}: [1, 2, 3]
        #Prezzo: [1, 2, 3]

  trend:
    weekly:
      ${data.target_column}: [5, 8, 13]

column_selection:
  # Meno dipendenza da 'prefixes'; concentriamoci su suffix+regex
  prefixes: []
  suffixes:
    - "W"           # lag/rolling che terminano con W
    - "sin"         # stagionalità
    - "cos"
    - "trend"
    - "percentage"
    - "season"
    - "Settimana"
    - "Item"
    - "product_group"
    - "PERIOD_TAG"        # per includere il product id/categoria se rimane come stringa
  regex:
    # Market features ammesse
    - "^market_sum_ex_lag\\d+$"
    - "^market_mean_ex_lag\\d+$"
    - "^market_trend_ex_w\\d+$"
    # Rolling generiche (se hai naming tipo *_rolling_op_\\d+[WM])
    - "_rolling_.*_\\d+[WM]$"
    # Week/calendario
    - "week_number$"
    - "is_peak_season$"
    - "^month$"
    - "^quarter$"
    # Fourier seasonality (k=1..K harmonics for annual/semi-annual/quarterly cycles)
    - "^fourier_(sin|cos)_k\\d+$"
    # Tempo codificato (se i nomi sono diversi)
    - f"{data.date_column}_sin$"
    - f"{data.date_column}_cos$"
    # Lags semplici del target/prezzo (nomi tipo Sellout_1W, Prezzo_4W, ecc.)
    - f"^{data.target_column}_\\d+[WM]$"
    - "^Prezzo_\\d+[WM]$"
    - "^product_age_w$"
    - "^${data.target_column}_ema_h\\d+$"     # cattura Sellout_ema_h4, h8, h13, ...
    - "^price_(gap|rel)_1W$"
    - "(?i).*promo.*"                  # se usi price_gap_1W / price_rel_1W

  to_exclude:
    #- "${data.date_column}"          # <— escludi la data grezza
    - "^market_sum_ex$"
    - "^market_mean_ex$"
    # Se NON conosci promo future, escludi eventuali colonne tipo _{h}W:
    #- "^type_promo_\\d+_\\d+[WM]$"
  callables: []

train:
  # For xlsx_sample: data spans W1 2024 → W21 2025 (~72 weeks total).
  # train_len capped at 52w so there is enough room for 2 cuts of 8w each.
  # For csv_history: restore to "24m" via CLI: train.train_len="24m" train.test_len="8w"
  train_len: "52w"
  test_len:  "8w"
  boundary: "2025-03-01"

cv:
  n_folds: 4            # 4 cuts; cuts 3-4 use ~40-48w training windows (still sufficient for LGBM)
  val_len: "8w"
  scoring: "neg_mean_absolute_error"
  recency_gamma: 0.0

stock:
  safety_stock_window: 24
  lead_time: 1
  service_level: 0.95


mlflow:
  tracking_uri: "file:./mlruns"     # o il tuo server
  experiment_name: "forecast-backtest"

backtest:
  enabled: true
  n_cuts: 4             # matches cv.n_folds
  output_dir: "outputs/backtest/${model.name}"
