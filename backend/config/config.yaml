defaults:
  - model: random_forest

data:
  file_path: "C:\\Users\\fraca\\forecast_refactored\\TEST DATI SAMPLE.xlsx"
  separator: ";"
  date_column: "Settimana"
  target_column: "Sellout"
  product_column: "Item"
  nr_horizon: -1
  product_name: "ALPHA"
  granularity: "weekly"

prepare:
  lag:
    weekly:
      ${data.target_column}: [-1,3, 4, 5]
      #${data.target_column}: [-1]
      Prezzo: [3, 4, 5]
    monthly:
      ${data.target_column}: [-1, 1, 2, 3]
      Prezzo: [1, 2, 3]

  percentage:
    weekly:
      ${data.target_column}: [2,3,4]
      Prezzo: [4, 8, 12]
    monthly:
      ${data.target_column}: [1, 2, 3]
      Prezzo: [1,2,3]

  rolling:
    max:
      weekly:
        ${data.target_column}: [2,3,5,10]
        Prezzo: [3]
      monthly:
        ${data.target_column}: [1]
        Prezzo: [1]
    min:
      weekly:
        ${data.target_column}: [2,3,5,10]
        Prezzo: [3]
      monthly:
        ${data.target_column}: [1]
        Prezzo: [1]
    std:
      weekly:
        ${data.target_column}: [3,5]
        Prezzo: [3,5]
      monthly:
        ${data.target_column}: [1]
        Prezzo: [1]
    median:
      weekly:
        ${data.target_column}: [5,10]
        Prezzo: [10]
      monthly:
        ${data.target_column}: [1,2.3]
        Prezzo: [1,2,3]

 # trend:
  #  weekly:
   #   ${data.target_column}: [5]
    #  Prezzo: [5]
    #monthly:
     # ${data.target_column}: [1]
      #Prezzo: [1]

column_selection:
  prefixes: ["type", "dispatches", "target", "numeric"]
  suffixes: ["W", "sin", "cos", "trend", "percentage"]  # 👈 importante per includere la colonna nel training
  regex: []
  to_exclude: []
  callables: []

train:
  train_len: "12m"
  test_len: "9w"
  boundary: "2025-03-24"

stock:
  safety_stock_window: 4
  lead_time: 1
  service_level: 0.95
