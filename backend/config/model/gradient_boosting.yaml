name: "gradient_boosting"

params:
  max_depth: 15
  n_estimators: 100
  min_samples_leaf: 5
  learning_rate: 0.05
  subsample: 0.8
  random_state: 42

param_grid:
  max_depth: [ 20, 30 ]
  min_samples_leaf: [3, 5,7]
  max_features: ["sqrt", "log2"]
  n_estimators: [300,500]
  learning_rate: [0.01, 0.05, 0.1]
  subsample: [0.6, 0.8, 1.0]
  criterion: ["squared_error"]
