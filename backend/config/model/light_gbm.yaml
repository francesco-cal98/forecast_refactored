name: "light_gbm"

params:
  objective: "quantile"
  alpha: 0.3   
  n_estimators: 200
  learning_rate: 0.05
  max_depth: 10
  min_child_samples: 20
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 0.1
  random_state: 42

param_grid:
  objective: ["quantile"]
  alpha: [0.1, 0.15,0.17,0.13, 0.5,  0.9]
  n_estimators: [100,  300]
  learning_rate: [0.01, 0.05]
  max_depth: [5,10,15]
  min_child_samples: [5]
  subsample: [0.8, 1.0]
  colsample_bytree: [0.8, 1.0]
  reg_alpha: [0.0]
  reg_lambda: [0.0]
