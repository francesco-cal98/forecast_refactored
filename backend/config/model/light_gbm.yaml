name: "light_gbm"

params:
  # Tweedie loss: handles zero-inflated, right-skewed demand distributions natively.
  # This is the loss used by M5 top-3 solutions for retail demand forecasting.
  # tweedie_variance_power in (1, 2):
  #   -> 1.0 = Poisson (count data, many zeros)
  #   -> 1.5 = compound Poisson-Gamma (retail demand sweet spot)
  #   -> 2.0 = Gamma (continuous, strictly positive)
  # 1.5 is the empirically best default for weekly retail sellout.
  objective: "tweedie"
  tweedie_variance_power: 1.5
  n_estimators: 800
  learning_rate: 0.05
  max_depth: 6
  num_leaves: 63
  min_child_samples: 20
  subsample: 0.8
  colsample_bytree: 0.8
  reg_alpha: 0.1
  reg_lambda: 0.1
  random_state: 42
  n_jobs: -1

param_grid:
  tweedie_variance_power: [1.0, 1.5, 1.8]
  n_estimators: [500, 800, 1200]
  learning_rate: [0.02, 0.05, 0.08]
  num_leaves: [31, 63, 127]
  min_child_samples: [10, 20, 40]
  subsample: [0.7, 0.8, 1.0]
  colsample_bytree: [0.7, 0.8, 1.0]
  reg_alpha: [0.0, 0.1]
  reg_lambda: [0.0, 0.1]
