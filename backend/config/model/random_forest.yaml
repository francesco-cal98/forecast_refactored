name: "random_forest"

params:
  max_depth: 10
  n_estimators: 900
  min_samples_leaf: 3
  random_state: 42
  criterion: "absolute_error"

param_grid:
  max_depth: [15,20,30,50]
  min_samples_leaf: [1,2,3, 5, 7]
  n_estimators: [700,1000,1200]
  max_features: ["log2"]
  bootstrap: [True, False]
  min_samples_split: [5,10,20,30]
  criterion: ["absolute_error"]
