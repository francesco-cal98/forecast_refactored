[pytest]
# Pytest configuration for forecast_refactored project

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Additional command line options
addopts =
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Strict markers (fail on unknown markers)
    --strict-markers
    # Strict config (fail on config warnings)
    --strict-config
    # Verbose output for failures
    --tb=short

# Markers for test organization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may use multiple modules)
    real_data: Tests requiring real data files
    slow: Tests that take a long time to run
    network: Tests that require network access (should be mocked)

# Coverage options (when using pytest-cov)
[coverage:run]
source = src/forecasting
omit =
    */tests/*
    */test_*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Ignore certain warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
